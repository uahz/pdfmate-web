name: iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html','app.js','theme.css','sw.js','manifest.webmanifest','capacitor.config.json','package.json','.github/workflows/ios-ipa.yml','assets/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web assets + Capacitor
        run: |
          mkdir -p www
          cp index.html app.js theme.css sw.js manifest.webmanifest www/
          cp -r icons www/icons
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios

      - name: Brand AppIcon (single-size 1024)
        run: |
          rm -f ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png
          cp assets/ios/AppIcon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          cp assets/ios/AppIcon-Contents.json ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json

      - name: CocoaPods install
        run: |
          cd ios/App
          pod install

      - name: Build unsigned IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          VER=$(node -p "require('../../package.json').version")
          zip -qry "../PDFMate-$VER-ios-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PDFMate-ios-ipa
          path: ios/PDFMate-*-ios-unsigned.ipa

      - name: Upload to release
        run: |
          VER=$(node -p "require('./package.json').version")
          gh release upload "v$VER" "ios/PDFMate-$VER-ios-unsigned.ipa" --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create "v$VER" "ios/PDFMate-$VER-ios-unsigned.ipa" -t "PDFMate v$VER" -n "Windows / Android / iOS installers" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
