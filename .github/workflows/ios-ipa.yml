name: iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html','app.js','theme.css','sw.js','manifest.webmanifest','capacitor.config.json','package.json','.github/workflows/ios-ipa.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web assets + Capacitor
        run: |
          mkdir -p www
          cp index.html app.js theme.css sw.js manifest.webmanifest www/
          cp -r icons www/icons
          npm install --no-audit --no-fund
          npx cap add ios
          npx @capacitor/assets generate --ios --assetPath assets
          npx cap sync ios

      - name: CocoaPods install
        run: |
          cd ios/App
          pod install

      - name: Build unsigned IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../PDFMate-1.0.0-ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PDFMate-ios-ipa
          path: ios/PDFMate-1.0.0-ios-unsigned.ipa

      - name: Upload to release
        run: |
          gh release upload v1.0.0 ios/PDFMate-1.0.0-ios-unsigned.ipa --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create v1.0.0 ios/PDFMate-1.0.0-ios-unsigned.ipa -t "PDFMate v1.0.0" -n "Windows / Android / iOS installers" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
