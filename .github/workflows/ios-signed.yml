name: iOS IPA (signed)

# 手动触发。需要先在仓库 Settings → Secrets → Actions 配置：
#   IOS_P12_BASE64              证书 .p12 文件的 base64（certutil -encode cert.p12 cert.b64 后去掉头尾行）
#   IOS_P12_PASSWORD            导出 .p12 时设置的密码
#   IOS_MOBILEPROVISION_BASE64  描述文件 .mobileprovision 的 base64
#   IOS_PROFILE_NAME            描述文件名称（如 "PDFMate Ad Hoc"）
#   IOS_TEAM_ID                 Apple 开发者 Team ID（10 位）
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web assets + Capacitor
        run: |
          mkdir -p www
          cp index.html app.js theme.css sw.js manifest.webmanifest www/
          cp -r icons www/icons
          npm install --no-audit --no-fund
          npx cap add ios
          npx @capacitor/assets generate --ios --assetPath assets
          npx cap sync ios

      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: pdfmate-ci-keychain
        run: |
          echo "$P12_BASE64" | base64 --decode > cert.p12
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 "$KEYCHAIN_PATH"
          security import cert.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Apply provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision > profile.plist
          echo "PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist)"
          echo "PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)"

      - name: Build signed IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution"
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../PDFMate-1.0.0-ios-signed.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PDFMate-ios-signed-ipa
          path: ios/PDFMate-1.0.0-ios-signed.ipa

      - name: Upload to release
        run: |
          gh release upload v1.0.0 ios/PDFMate-1.0.0-ios-signed.ipa --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create v1.0.0 ios/PDFMate-1.0.0-ios-signed.ipa -t "PDFMate v1.0.0" -n "Windows / Android / iOS installers" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
