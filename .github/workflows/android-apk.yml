name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html','app.js','theme.css','sw.js','manifest.webmanifest','capacitor.config.json','package.json','.github/workflows/android-apk.yml','assets/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web assets + Capacitor
        run: |
          mkdir -p www
          cp index.html app.js theme.css sw.js manifest.webmanifest www/
          cp -r icons www/icons
          npm install --no-audit --no-fund
          npx cap add android
          npx @capacitor/assets generate --android --assetPath assets
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VER=$(node -p "require('./package.json').version")
          mv android/app/build/outputs/apk/debug/app-debug.apk "PDFMate-$VER-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PDFMate-android-apk
          path: PDFMate-*-android.apk

      - name: Upload to release
        run: |
          VER=$(node -p "require('./package.json').version")
          gh release upload "v$VER" "PDFMate-$VER-android.apk" --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create "v$VER" "PDFMate-$VER-android.apk" -t "PDFMate v$VER" -n "PDFMate installers: Windows (Setup / Portable), Android (APK), iOS (unsigned IPA). All processing is done locally on your device." --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
