name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html','app.js','theme.css','sw.js','manifest.webmanifest','capacitor.config.json','package.json','.github/workflows/android-apk.yml','assets/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web assets + Capacitor
        run: |
          mkdir -p www
          cp index.html app.js theme.css sw.js manifest.webmanifest www/
          cp -r icons www/icons
          npm install --no-audit --no-fund
          npx cap add android
          npx @capacitor/assets generate --android --assetPath assets
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk PDFMate-1.0.0-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PDFMate-android-apk
          path: PDFMate-1.0.0-android.apk

      - name: Upload to release
        run: |
          gh release upload v1.0.0 PDFMate-1.0.0-android.apk --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create v1.0.0 PDFMate-1.0.0-android.apk -t "PDFMate v1.0.0" -n "Windows / Android / iOS installers" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
